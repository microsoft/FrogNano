[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "frognano"
version = "0.1.0"
description = "FrogNano"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "kubernetes==36.0.3",
    "openai==3.19.2",
    "PyYAML==6.0.3",
    "tiktoken==0.14.0",
    "transformers==5.17.0",
]

[project.urls]
Repository = "https://github.com/microsoft/FrogNano"
Issues = "https://github.com/microsoft/FrogNano/issues"

[project.scripts]
frognano-eval = "frognano.cli:main"

[project.optional-dependencies]
wandb = [
    "wandb==0.30.0",
]
dev = [
    "black==26.5.1",
    "isort==9.0.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
]

[tool.setuptools.packages.find]
include = ["frognano*"]

[tool.setuptools.package-data]
"frognano.configs.eval" = ["*.yaml"]
"frognano.configs.eval.image_locks" = ["*.json"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
addopts = [
    "--cov=frognano",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]

[tool.coverage.run]
omit = [
    "frognano/runtimes/kubernetes.py",
]
