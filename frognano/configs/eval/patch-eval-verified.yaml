dataset: patch_eval_verified
output_dir: ${FROGNANO_OUTPUT_ROOT:-~/frognano-eval-results}/patch-eval-verified
cache_dir: ${FROGNANO_CACHE_DIR:-~/.cache/frognano/harbor}

num_tasks: null
seed: 42
seeds_per_task: 3
max_workers: ${FROGNANO_MAX_WORKERS:-150}
max_workers_per_seed: null
max_attempts: 2
max_steps: 150
max_context_tokens: 131072
max_total_time_sec: 10800
resume: true
resume_retry_error_contains: null

model:
  name: ${FROGNANO_MODEL_NAME:-}
  base_url: ${FROGNANO_MODEL_BASE_URL:-}
  api_key_env: OPENAI_API_KEY
  temperature: 0.6
  max_tokens_per_turn: 8192
  timeout_sec: 7200
  max_retries: 5
  parallel_tool_calls: true
  extra_body:
    chat_template_kwargs:
      enable_thinking: true
    top_p: 0.95
    top_k: 20
    min_p: 0.0
    presence_penalty: 0.0
    repetition_penalty: 1.0

kubernetes:
  namespace: ${K8S_NAMESPACE:-default}
  context: ${KUBE_CONTEXT:-}
  kubeconfig: ${KUBE_CONFIG_PATH:-}
  image_registry: ${K8S_IMAGE_REGISTRY:-}
  service_account: ${K8S_SERVICE_ACCOUNT:-}
  pull_secret: ${K8S_PULL_SECRET:-}
  pod_start_timeout_sec: 900
  keep_pods: false
  labels:
    frognano-experiment: patch-eval-verified
