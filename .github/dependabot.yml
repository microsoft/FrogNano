version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    groups:
      github-actions:
        patterns:
          - "*"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: pip
    directory: /
    groups:
      python-development:
        dependency-type: development
        patterns:
          - "*"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
